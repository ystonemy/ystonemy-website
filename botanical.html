<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YstoneMy | Resin Art & Nature-Inspired Crafts</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
      background: #faf9f6;
      line-height: 1.6;
    }

    header {
      background: #ffffff;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid #eeeeee;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #222;
    }

    nav a {
      text-decoration: none;
      color: #444;
      margin-left: 28px;
      font-size: 14px;
    }

    nav a:hover {
      color: #888;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background:
        linear-gradient(rgba(255,255,255,0.72), rgba(255,255,255,0.72)),
        url("https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1800&q=80")
        center/cover;
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: 58px;
      letter-spacing: 6px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #555;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 13px 28px;
      background: #222;
      color: white;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .button:hover {
      background: #555;
    }

    section {
      padding: 80px 8%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #777;
    }

    .collections {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .card {
      background: white;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 25px;
    }

    .card-content h3 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .card-content p {
      color: #666;
      font-size: 14px;
    }

    .about {
      background: #f1eee8;
    }

    .about-content {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    .about-content h2 {
      font-size: 34px;
      margin-bottom: 20px;
    }

    .about-content p {
      color: #555;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .custom {
      background: white;
    }

    .custom-content {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .custom-content h2 {
      font-size: 34px;
      margin-bottom: 20px;
    }

    .custom-content p {
      color: #666;
      margin-bottom: 25px;
    }

    .contact {
      text-align: center;
      background: #222;
      color: white;
    }

    .contact h2 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .contact p {
      color: #ddd;
      margin-bottom: 10px;
    }

    .contact a {
      color: white;
      text-decoration: none;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }
